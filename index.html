<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141114">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дом Рокера">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Дом Рокера</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik+Wet+Paint&family=Russo+One&family=PT+Serif:wght@700&family=Oswald:wght@600&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: full-bleed garage scene (sticker-book collage) with overlaid HUD; game screen = blurred garage + board; punk zine palette */
:root{
  --tar:#141114; --tar2:#221c22; --tar3:#2e262e; --paper:#ece6d6; --paper2:#d6ccb4;
  --blood:#d7263d; --blood2:#9b1626; --tape:#ffd21f; --ink:#0b090b; --steel:#9a96a0;
  --f-display:"Rubik Mono One","Russo One",Impact,"Arial Black",sans-serif;
  --f-ui:"Russo One","Arial Black",Impact,system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --torn:polygon(0 7px,5% 0,11% 5px,18% 1px,26% 6px,33% 0,41% 4px,49% 0,57% 6px,64% 1px,72% 5px,80% 0,87% 6px,94% 1px,100% 5px,100% calc(100% - 6px),95% 100%,88% calc(100% - 5px),81% 100%,73% calc(100% - 4px),65% 100%,57% calc(100% - 6px),49% 100%,41% calc(100% - 5px),33% 100%,25% calc(100% - 4px),17% 100%,9% calc(100% - 6px),3% 100%,0 calc(100% - 3px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--tar)}
@supports (height:100dvh){html{height:100dvh}}
body{height:100%;margin:0;background:var(--tar);color:var(--paper);font:15px/1.4 var(--f-body);overflow:hidden;padding-block:0;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
#grain{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.08;mix-blend-mode:screen}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* ransom-note logo */
.ransom{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;line-height:1}
.ransom i{font-style:normal;display:inline-block;padding:.07em .13em .05em;box-shadow:2px 3px 0 #000;text-transform:uppercase}
.ransom .sp{width:.35em;box-shadow:none;padding:0}

/* buttons */
.btn{font-family:var(--f-ui);font-size:17px;letter-spacing:.03em;text-transform:uppercase;border:3px solid var(--ink);background:var(--paper);color:var(--ink);
  padding:11px 18px;box-shadow:0 0 0 3px var(--paper),6px 6px 0 3px #000;cursor:pointer;transform:rotate(-1deg);transition:transform .08s,box-shadow .08s;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translate(3px,3px) rotate(-1deg);box-shadow:0 0 0 3px var(--paper),2px 2px 0 3px #000}
.btn.red{background:var(--blood);color:var(--paper)}
.btn.yellow{background:var(--tape)}
.btn.ghost{background:var(--tar2);color:var(--paper);box-shadow:0 0 0 3px var(--paper2),4px 4px 0 3px #000}
.btn.small{font-size:13px;padding:8px 12px}
.btn[disabled]{filter:grayscale(1) brightness(.7);cursor:not-allowed}
.btn:focus-visible,.bst:focus-visible,.iconbtn:focus-visible,.opt:focus-visible{outline:3px dashed var(--tape);outline-offset:4px}
.iconbtn{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:3px 3px 0 #000}
.iconbtn svg{width:22px;height:22px}
.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:rotate(-1deg) scale(1.06)}}

/* home */
#room3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hot3d{position:absolute;left:0;top:0;z-index:2;width:56px;height:56px;margin:-70px 0 0 -28px;border-radius:50%;border:3px solid var(--ink);background:#5a535c;color:var(--paper);box-shadow:0 0 0 4px var(--paper),3px 6px 0 4px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;gap:1px;font:17px var(--f-ui);cursor:pointer;padding:0}
.hot3d svg{width:22px;height:22px}
.hot3d::after{content:"";position:absolute;left:50%;bottom:-17px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--paper)}
.hot3d.can{background:var(--blood);animation:hotb 1s ease-in-out infinite}
@keyframes hotb{50%{margin-top:-78px}}
#room{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.homeTop{position:relative;z-index:3;padding-block:10px 18px;pointer-events:none;background:linear-gradient(rgba(10,8,10,.8),rgba(10,8,10,0))}
.homeTop>*{pointer-events:auto}
.topbar{display:flex;gap:8px;align-items:center}
.res{display:flex;align-items:center;gap:5px;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;padding:7px 10px 7px 7px;clip-path:var(--torn);min-width:0;font-variant-numeric:tabular-nums}
.res:nth-child(1){transform:rotate(-2deg)} .res:nth-child(2){transform:rotate(1.5deg)} .res:nth-child(3){transform:rotate(-1deg)}
.res svg{width:20px;height:20px;flex:none}
.res small{font:600 11px var(--f-body);color:var(--blood2)}
.topbar .sp{flex:1}
.homeTop .ransom{margin-top:10px;font-size:20px;pointer-events:none}
.say{position:absolute;left:0;right:0;bottom:98px;z-index:5;display:flex;gap:10px;align-items:flex-end;cursor:pointer}
.say canvas,.tut canvas{flex:none;width:68px;height:68px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 0 0 3px var(--paper),3px 4px 0 3px #000}
.bubble{flex:1;min-width:0;background:var(--paper);color:var(--ink);padding:12px 14px 10px;clip-path:var(--torn);font-size:15px;line-height:1.35}
.bubble b{display:block;font:12px var(--f-display);color:var(--blood);letter-spacing:.02em;text-transform:uppercase;margin-bottom:3px}
.bubble .more{display:block;margin-top:5px;text-align:right;font:11px var(--f-ui);color:var(--blood2);text-transform:uppercase;letter-spacing:.06em}
.bubble .more:empty{display:none}
.homebar{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;gap:16px;padding-block:26px 18px;align-items:center;background:linear-gradient(rgba(10,8,10,0),rgba(10,8,10,.85) 45%)}
.homebar .btn{flex:1}
.homebar .play{flex:1.35;font-size:21px;padding-block:14px}
.homebar img{width:32px;height:32px;margin:-8px 0}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--blood);color:var(--paper);font-size:12px;padding:0 6px}

/* game */
#gameBg{position:absolute;inset:-12px;background:#1c171c center/cover no-repeat;filter:blur(3px) brightness(.36) saturate(.85);z-index:0}
#game>*:not(#gameBg){position:relative;z-index:1}
.hud{display:flex;align-items:center;gap:10px;padding-block:12px 4px}
.moves{flex:none;width:72px;height:72px;border-radius:50%;background:var(--blood);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:3px solid var(--ink);box-shadow:0 0 0 3px var(--paper),4px 5px 0 3px #000;transform:rotate(-5deg);font-family:var(--f-ui);line-height:1}
.moves b{font-size:29px;font-weight:400;font-variant-numeric:tabular-nums}
.moves span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.moves.low{animation:pulse .8s infinite}
.goals{flex:1;min-width:0;min-height:76px;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 10px;clip-path:var(--torn);transform:rotate(.8deg)}
.goal{position:relative;display:flex;flex-direction:column;align-items:center}
.goal img{width:46px;height:46px}
.goal span{font-family:var(--f-ui);font-size:16px;line-height:1;font-variant-numeric:tabular-nums}
.goal.done span{visibility:hidden}
.goal.done::after{content:"";position:absolute;left:50%;bottom:-2px;width:12px;height:20px;border:solid var(--blood);border-width:0 5px 5px 0;transform:translateX(-50%) rotate(40deg)}
.goal.bump img{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.3) rotate(-8deg)}}
.boardWrap{flex:1;min-height:0}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.boosts{display:flex;justify-content:center;align-items:center;gap:18px;padding-block:6px 14px}
.bst{position:relative;width:64px;height:64px;border-radius:50%;background:var(--tar3);border:3px solid var(--paper);display:grid;place-items:center;cursor:pointer;box-shadow:3px 4px 0 #000;transition:transform .12s}
.bst img{width:52px;height:52px;pointer-events:none}
.bst .n{position:absolute;right:-6px;bottom:-5px;min-width:24px;height:24px;border-radius:12px;background:var(--blood);color:var(--paper);font:13px/20px var(--f-ui);border:2px solid var(--ink);text-align:center;padding:0 5px}
.bst.on{background:var(--tape);border-color:var(--ink);transform:scale(1.1) rotate(-8deg)}
.bst.off{opacity:.45}
.boostHint{position:absolute;left:0;right:0;top:4px;z-index:6;text-align:center;pointer-events:none}
.boostHint span{display:inline-block;background:var(--tape);color:var(--ink);font:14px var(--f-ui);padding:6px 12px;transform:rotate(-1.5deg);box-shadow:3px 3px 0 #000}
.tut{position:absolute!important;left:0;right:0;top:6px;z-index:7!important;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tut.bottom{top:auto;bottom:8px;align-items:flex-end}
.tut canvas{width:58px;height:58px}
.flyer{position:absolute;width:38px;height:38px;z-index:30;pointer-events:none;transition:transform .46s cubic-bezier(.45,-0.35,.6,1)}
#banner{position:absolute;left:0;right:0;top:38%;z-index:40;pointer-events:none;text-align:center;font-family:var(--f-display);font-size:clamp(26px,8.5vw,40px);line-height:1.05;color:var(--tape);
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),7px 7px 0 var(--blood);opacity:0;padding-inline:12px}
#banner.show{animation:banner 1.5s forwards}
@keyframes banner{0%{opacity:0;transform:scale(2.2) rotate(-10deg)}14%{opacity:1;transform:scale(.94) rotate(-4deg)}22%{transform:scale(1.04) rotate(-4deg)}78%{opacity:1;transform:scale(1) rotate(-4deg)}100%{opacity:0;transform:scale(.9) translateY(-30px) rotate(-4deg)}}

/* modal */
#modal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(9,7,9,.74);padding-block:16px}
#modal.low{align-items:flex-end;background:rgba(9,7,9,.25)}
.sheet{position:relative;width:min(100%,410px);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);padding:32px 20px 24px;clip-path:var(--torn);transform:rotate(-.6deg);animation:slam .36s cubic-bezier(.2,1.5,.4,1)}
@keyframes slam{0%{transform:scale(1.25) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(-.6deg);opacity:1}}
.sheet .tp{position:absolute;top:8px;width:78px;height:20px;background:rgba(255,210,31,.85)}
.sheet .tp.l{left:18px;transform:rotate(-7deg)} .sheet .tp.r{right:18px;transform:rotate(6deg)}
.sheet h2{display:table;margin:4px auto 8px;font:400 clamp(18px,5.4vw,23px)/1.2 var(--f-display);background:var(--ink);color:var(--paper);padding:7px 14px 6px;transform:rotate(-2deg);text-align:center;box-shadow:4px 4px 0 var(--blood);max-width:100%}
.sheet h3{font:12px var(--f-display);letter-spacing:.04em;color:var(--blood);margin:18px 0 8px;text-transform:uppercase}
.sheet p{margin:6px 0;text-wrap:pretty}
.sheet .sub{text-align:center;font:600 12px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:#6b6152}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.row .btn{flex:1;min-width:130px}
.mgoals{display:flex;justify-content:center;gap:14px;margin:12px 0 6px;flex-wrap:wrap}
.mgoals div{display:flex;flex-direction:column;align-items:center;font:16px var(--f-ui)}
.mgoals img{width:54px;height:54px}
.tip{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--paper);padding:10px 12px;margin-top:12px;transform:rotate(.6deg)}
.tip img{width:56px;height:56px;flex:none}
.tip p{margin:0;font-size:14px}
.pre{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.opt{position:relative;width:86px;padding:8px 4px 6px;border:3px solid var(--ink);background:#fff8e6;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:11px var(--f-ui);color:var(--ink);text-transform:uppercase}
.opt img{width:54px;height:54px}
.opt .n{position:absolute;top:-10px;right:-10px;min-width:24px;height:24px;border-radius:12px;background:var(--blood);color:var(--paper);font:12px/20px var(--f-ui);border:2px solid var(--ink);padding:0 5px}
.opt.on{background:var(--tape);transform:rotate(-4deg) scale(1.05);box-shadow:3px 3px 0 var(--ink)}
.opt .sw{width:46px;height:32px;border:3px solid var(--ink);margin-bottom:2px}
.big{display:flex;justify-content:center;align-items:center;gap:22px;margin:12px 0 4px;font:28px var(--f-ui)}
.big span{display:flex;align-items:center;gap:6px}
.big svg{width:34px;height:34px}
.tasks{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.task{display:flex;align-items:center;gap:12px;padding:8px 10px;background:#fff8e6;border:3px solid var(--ink)}
.task img{width:60px;height:60px;flex:none;margin:-6px 0}
.task.locked{opacity:.5}
.task .tt{flex:1;min-width:0;font:600 15px var(--f-body)}
.task .tt small{display:block;font-weight:400;font-size:12px;color:#6b6152}
.task .btn{font-size:14px;padding:8px 10px;box-shadow:3px 3px 0 #000;gap:4px}
.task .btn svg{width:16px;height:16px}
.prog{height:12px;background:var(--ink);margin-top:10px;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--blood)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px dashed #b9ae95;font:600 15px var(--f-body)}
.set small{display:block;font-weight:400;color:#6b6152;font-size:12px}
.sw2{position:relative;width:56px;height:30px;border:3px solid var(--ink);background:#cfc5ad;cursor:pointer;flex:none}
.sw2::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--ink);transition:left .15s}
.sw2[aria-pressed="true"]{background:var(--blood)}
.sw2[aria-pressed="true"]::after{left:28px;background:var(--paper)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.enc{display:flex;gap:12px;align-items:center;padding:6px 0;border-bottom:1px dashed #c9bea4}
.enc .ic{flex:none;display:flex;width:66px;justify-content:center}
.enc img{width:50px;height:50px}
.enc .ic img+img{margin-left:-20px}
.enc b{display:block;font:600 14px var(--f-body)}
.enc span{font-size:13px;color:#4a4236}
#toast{position:absolute;left:50%;bottom:120px;z-index:60;transform:translateX(-50%);background:var(--tape);color:var(--ink);font:14px var(--f-ui);padding:8px 14px;box-shadow:3px 3px 0 #000;pointer-events:none;max-width:90%;text-align:center}

/* title */
#title{position:absolute;inset:0;z-index:70;background:radial-gradient(circle at 50% 40%,#2a1f26,var(--tar) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
#title .ransom{font-size:clamp(34px,11vw,54px);max-width:9.5em}
#title canvas{width:min(92%,380px);height:auto}
#title .lead{max-width:30ch;color:var(--paper2);margin:0 0 16px;font-size:15px}
#title .btn{font-size:22px;padding:14px 34px}
/* телефон: маленькие экраны */
@media (max-height:740px){.moves{width:60px;height:60px}.moves b{font-size:24px}.goals{min-height:62px;gap:8px}.goal img{width:38px;height:38px}.goal span{font-size:14px}
  .bst{width:54px;height:54px}.bst img{width:42px;height:42px}.hud{padding-block:8px 2px}.boosts{padding-block:4px 10px;gap:14px}
  .homebar{padding-block:20px 12px}.homebar .play{font-size:18px;padding-block:12px}.btn{font-size:15px;padding:10px 14px}.homeTop .ransom{font-size:16px;margin-top:6px}
  .say{bottom:82px}.bubble{font-size:14px;padding:10px 12px 8px}.say canvas{width:56px;height:56px}.tut canvas{width:48px;height:48px}
  .sheet{padding:28px 16px 20px}.mgoals img{width:46px;height:46px}.opt{width:78px}.opt img{width:46px;height:46px}}
@media (max-width:370px){.res{font-size:14px;padding:6px 8px 6px 5px}.res svg{width:17px;height:17px}.topbar{gap:6px}.iconbtn{width:40px;height:40px}.homebar{gap:12px}.homebar .play{font-size:17px}.homebar img{width:26px;height:26px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="app">
  <section id="home" class="screen">
    <canvas id="room" aria-label="Гараж, который ты ремонтируешь"></canvas>
    <div class="homeTop gut">
      <header class="topbar">
        <div class="res" title="Жизни"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3.1A4.6 4.6 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#d7263d" stroke="#0b090b" stroke-width="2"/></svg><b id="livesN">5</b><small id="livesT"></small></div>
        <div class="res" title="Звёзды"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.5 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.2l7.1-.7z" fill="#ffd21f" stroke="#0b090b" stroke-width="2" stroke-linejoin="round"/></svg><b id="starsN">0</b></div>
        <div class="res" title="Монеты"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#e8b93c" stroke="#0b090b" stroke-width="2"/><path d="M9 8h4.5a2.5 2.5 0 0 1 0 5H9V8zm0 5v4m-1.5-2h5" stroke="#0b090b" stroke-width="2" fill="none"/></svg><b id="coinsN">0</b></div>
        <span class="sp"></span>
        <button class="iconbtn" id="setBtn" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="#0b090b" stroke-width="2.4"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
      </header>
      <div class="ransom" id="logoSmall" aria-label="Дом Рокера"></div>
    </div>
    <div class="say gut" id="say" hidden><canvas id="ava" width="136" height="136"></canvas><div class="bubble"><b>Гоша</b><span id="sayTxt"></span><span class="more">нажми, чтобы продолжить</span></div></div>
    <nav class="homebar gut">
      <button class="btn yellow" id="tasksBtn"><img id="taskIco" alt="">Задачи<span class="badge" id="taskBadge" hidden>!</span></button>
      <button class="btn red play" id="playBtn">Уровень <span id="lvlN">1</span></button>
    </nav>
  </section>

  <section id="game" class="screen" hidden>
    <div id="gameBg"></div>
    <div class="hud gut">
      <div class="moves" id="movesBox"><b id="movesN">20</b><span>ходов</span></div>
      <div class="goals" id="goals"></div>
      <button class="iconbtn" id="pauseBtn" aria-label="Пауза"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="#0b090b"/><rect x="14" y="5" width="4" height="14" fill="#0b090b"/></svg></button>
    </div>
    <div class="boardWrap" id="boardWrap">
      <canvas id="board"></canvas>

function stickerize(src,b,shadow=true){
  const W=src.width+b*2+(shadow?b*.8:0),H=src.height+b*2+(shadow?b*1.3:0);
  const sil=col=>{const c=mk(src.width,src.height),x=c.getContext('2d');x.drawImage(src,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,c.width,c.height);return c};
  const w=sil('#f6f1e4'),k=sil('#000'),o=mk(W,H),x=o.getContext('2d');
  if(shadow){x.globalAlpha=.07;for(let i=0;i<16;i++){const a=i/16*Math.PI*2;x.drawImage(k,b+Math.cos(a)*b+b*.6,b+Math.sin(a)*b+b*1.1)}x.globalAlpha=1}
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2;x.drawImage(w,b+Math.cos(a)*b,b+Math.sin(a)*b)}
  x.drawImage(src,b,b);return o;
}

function genLevel(n){
  const R=mulberry(n*7919+13),pick=a=>a[Math.floor(R()*a.length)];
  const w=pick([8,9]),h=pick([8,9]);const g=Array.from({length:h},()=>Array(w).fill('.'));
  if(R()<.5){g[0][0]=g[0][w-1]=g[h-1][0]=g[h-1][w-1]='x'}
  const sym=(r,c,ch)=>{g[r][c]=ch;g[r][w-1-c]=ch};
  const kind=pick(['box','dirt','chain','guitar','mix','mix']);
  if(kind==='box'||kind==='mix')for(const r of [2,4,6])if(r<h-1)for(let c=1;c<w/2;c+=2)if(R()<.7&&g[r][c]==='.')sym(r,c,String(1+Math.floor(R()*3)));
  if(kind==='dirt'||kind==='mix'){const m=Math.floor(h/2);for(let r=m-2;r<=m+1;r++)for(let c=2;c<w-2;c++)if(g[r][c]==='.')g[r][c]=R()<.4?'D':'d'}
  if(kind==='chain')for(let k=0;k<6;k++){const r=1+Math.floor(R()*(h-2)),c=Math.floor(R()*(w/2));if(g[r][c]==='.')sym(r,c,R()<.5?'c':'C')}
  const goals=[];if(kind==='guitar'||(kind==='mix'&&R()<.4)){g[0][Math.floor(w/2)]='g';goals.push({g:3+Math.floor(R()*2)})}
  if(kind==='chain'||kind==='guitar')goals.push({c:Math.floor(R()*5),n:22+Math.floor(R()*10)});
  return LV(26+Math.floor(R()*8)+Math.min(8,Math.floor(n/10)),R()<.25?6:5,g.map(r=>r.join('')),goals);
}

function pickNoMatch(r,c){
  const cols=shuffleArr([...Array(G.colors).keys()]);

    fresh=false;if(findMove())return;

}

/* ---------- обучение */
function rigPattern(kind){
  const P=PAT[kind];
  const ok=(r,c)=>{const k=cellRC(r,c);return k&&k.on&&!k.box&&!k.dirt&&k.tile&&k.tile.kind==='n'&&!k.tile.lock};
  const okLoose=(r,c)=>{const k=cellRC(r,c);return k&&k.on&&!k.box&&k.tile&&k.tile.kind==='n'&&!k.tile.lock};
  const mr=Math.floor(G.R/2),mc=Math.floor(G.C/2)-2;
  const rows=[...Array(G.R).keys()].sort((a,b)=>Math.abs(a-mr)-Math.abs(b-mr)),cols=[...Array(G.C).keys()].sort((a,b)=>Math.abs(a-mc)-Math.abs(b-mc));
  for(const test of [ok,okLoose])for(const r0 of rows)for(const c0 of cols){
    if(!P.cells.every(([dr,dc])=>test(r0+dr,c0+dc)))continue;
    const A=2,B=0,fixed=new Set();
    for(const [dr,dc,s] of P.cells){G.cells[r0+dr][c0+dc].tile.color=s==='A'?A:B;fixed.add((r0+dr)*64+c0+dc)}
    for(const [dr,dc,s] of P.cells){if(s!=='A')continue;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const r=r0+dr+a,c=c0+dc+b;if(fixed.has(r*64+c))continue;const t=tileAt({r,c});if(t&&t.kind==='n'&&t.color===A)t.color=[1,3,4][ri(3)]}}
    for(let it=0;it<80;it++){const gs=findGroups();if(!gs.length)break;for(const g of gs)for(const p of g.cells)if(!fixed.has(p.r*64+p.c)){const t=tileAt(p);if(t&&t.kind==='n')t.color=[1,3,4,0][ri(4)]}}
    return {a:{r:r0+P.a[0],c:c0+P.a[1]},b:{r:r0+P.b[0],c:c0+P.b[1]},fixed};
  }
  return null;
}
function setupTutorial(n){
  const steps=[],present={};
  for(let r=0;r<G.R;r++)for(let c=0;c<G.C;c++){const k=G.cells[r][c];if(!k.on)continue;const add=key=>(present[key]=present[key]||[]).push({r,c});
    if(k.box)add('box'+k.box.hp);if(k.dirt)add('dirt'+k.dirt);if(k.tile&&k.tile.lock)add('chain'+k.tile.lock);if(k.tile&&k.tile.kind==='guitar')add('guitar')}
  for(const key of ['box1','box2','box3','chain1','chain2','dirt1','dirt2','guitar'])if(present[key]&&!SV.seen[key])steps.push({type:'info',key,text:OBS[key],cells:present[key]});
  let fixed=new Set();const tk=TUT_LEVELS[n];
  if(tk&&!SV.tut[n]){const m=rigPattern(tk);if(m){fixed=m.fixed;const P=PAT[tk];steps.push({type:'swap',a:m.a,b:m.b,text:P.t[0]});
    if(tk==='vinyl')steps.push({type:'vswap',text:P.t[1]});else if(tk!=='match')steps.push({type:'tap',text:P.t[1]})}}
  if(steps.length)G.tut={steps,i:0,waiting:false,n,fixed,t0:0};
}
function findSpecialCell(kind){for(let r=0;r<G.R;r++)for(let c=0;c<G.C;c++){const k=G.cells[r][c];if(movable(k)&&isSpecial(k.tile)&&(!kind||k.tile.kind===kind))return {r,c}}return null}

/* ---------- совпадения */
function findGroups(){
  const R=G.R,C=G.C,mark=[];for(let r=0;r<R;r++)mark.push(new Array(C).fill(false));
  const hR=[],vR=[],sq=[];
  for(let r=0;r<R;r++){let c=0;while(c<C){const col=colorAt(r,c);if(col<0){c++;continue}let e=c;while(e+1<C&&colorAt(r,e+1)===col)e++;if(e-c>=2){hR.push({r,c0:c,c1:e});for(let q=c;q<=e;q++)mark[r][q]=true}c=e+1}}
  for(let c=0;c<C;c++){let r=0;while(r<R){const col=colorAt(r,c);if(col<0){r++;continue}let e=r;while(e+1<R&&colorAt(e+1,c)===col)e++;if(e-r>=2){vR.push({c,r0:r,r1:e});for(let q=r;q<=e;q++)mark[q][c]=true}r=e+1}}
  for(let r=0;r<R-1;r++)for(let c=0;c<C-1;c++){const col=colorAt(r,c);if(col>=0&&colorAt(r,c+1)===col&&colorAt(r+1,c)===col&&colorAt(r+1,c+1)===col){sq.push({r,c});mark[r][c]=mark[r][c+1]=mark[r+1][c]=mark[r+1][c+1]=true}}
  if(!hR.length&&!vR.length&&!sq.length)return [];
  const gid=[];for(let r=0;r<R;r++)gid.push(new Array(C).fill(-1));
  const groups=[];
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(!mark[r][c]||gid[r][c]>=0)continue;const col=colorAt(r,c),id=groups.length,cells=[],st=[[r,c]];gid[r][c]=id;
    while(st.length){const [a,b]=st.pop();cells.push({r:a,c:b});for(const [dr,dc] of DIRS){const nr=a+dr,nc=b+dc;if(nr<0||nc<0||nr>=R||nc>=C)continue;if(mark[nr][nc]&&gid[nr][nc]<0&&colorAt(nr,nc)===col){gid[nr][nc]=id;st.push([nr,nc])}}}
    groups.push({id,col,cells,hMax:0,vMax:0,sq:null})}
  for(const h of hR){const g=groups[gid[h.r][h.c0]];const L=h.c1-h.c0+1;if(L>g.hMax){g.hMax=L;g.hRun=h}}
  for(const v of vR){const g=groups[gid[v.r0][v.c]];const L=v.r1-v.r0+1;if(L>g.vMax){g.vMax=L;g.vRun=v}}
  for(const s of sq){const g=groups[gid[s.r][s.c]];if(!g.sq)g.sq=s}
  for(const g of groups){
    if(g.hMax>=5||g.vMax>=5)g.type='vinyl';
    else if(g.hMax>=3&&g.vMax>=3){g.type='bomb';for(const h of hR)for(const v of vR)if(gid[h.r][h.c0]===g.id&&gid[v.r0][v.c]===g.id&&v.c>=h.c0&&v.c<=h.c1&&h.r>=v.r0&&h.r<=v.r1)g.pref={r:h.r,c:v.c}}
    else if(g.hMax===4)g.type='rh';else if(g.vMax===4)g.type='rv';else if(g.sq)g.type='bat';else g.type=null;
    if(!g.pref){if(g.type==='vinyl'||g.type==='rh'||g.type==='rv'){if(g.hMax>=g.vMax){const h=g.hRun;g.pref={r:h.r,c:Math.floor((h.c0+h.c1)/2)}}else{const v=g.vRun;g.pref={r:Math.floor((v.r0+v.r1)/2),c:v.c}}}else if(g.sq)g.pref={r:g.sq.r+1,c:g.sq.c}}
  }
  return groups;
}
function findMove(){
  for(let r=0;r<G.R;r++)for(let c=0;c<G.C;c++){const k=G.cells[r][c];if(movable(k)&&isSpecial(k.tile))return {a:{r,c},b:{r,c},sp:true}}
  const sw=(a,b)=>{const ka=G.cells[a.r][a.c],kb=G.cells[b.r][b.c];const t=ka.tile;ka.tile=kb.tile;kb.tile=t};
  for(let r=0;r<G.R;r++)for(let c=0;c<G.C;c++){const k=G.cells[r][c];if(!movable(k))continue;
    for(const [dr,dc] of [[0,1],[1,0]]){const b={r:r+dr,c:c+dc},kb=cellRC(b.r,b.c);if(!movable(kb))continue;if(k.tile.kind!=='n'&&kb.tile.kind!=='n')continue;
      sw({r,c},b);const ok=findGroups().length>0;sw({r,c},b);if(ok)return {a:{r,c},b}}}
  return null;
}

/* ---------- гравитация */
function aboveIdx(r,c){for(let q=r-1;q>=0;q--)if(G.cells[q][c].on)return q;return -1}
function belowIdx(r,c){for(let q=r+1;q<G.R;q++)if(G.cells[q][c].on)return q;return -1}
function canFillVert(r,c){const a=aboveIdx(r,c);if(a<0)return true;const k=G.cells[a][c];if(k.box||(k.tile&&(k.tile.lock||k.tile.queued)))return false;if(k.tile)return true;return canFillVert(a,c)}
function moveTile(fr,fc,tr,tc){const t=G.cells[fr][fc].tile;G.cells[fr][fc].tile=null;G.cells[tr][tc].tile=t;t.r=tr;t.c=tc}
function countGuitars(){let n=0;for(const row of G.cells)for(const k of row)if(k.tile&&k.tile.kind==='guitar')n++;return n}
function spawnTile(r,c){
  let t;
  if(G.guitarsLeft>0){const on=countGuitars();if(on<2&&Math.random()<(on===0?.45:.07)){t=mkTile('guitar',-1,r,c);G.guitarsLeft--}}
  if(!t)t=mkTile('n',ri(G.colors),r,c);
  let minY=r;for(let q=0;q<G.R;q++){const tt=G.cells[q][c].tile;if(tt&&tt.y<minY)minY=tt.y}
  t.y=Math.min(r-1,minY-1);t.vy=4;G.cells[r][c].tile=t;
}
function gravity(){
  let any=false,changed=true,guard=0;
  while(changed&&guard++<400){
    changed=false;
    for(let c=0;c<G.C;c++)for(let r=G.R-1;r>=0;r--){const k=G.cells[r][c];if(!k.on||k.box||k.tile)continue;
      const a=aboveIdx(r,c);if(a<0){spawnTile(r,c);changed=true;continue}
      const ak=G.cells[a][c];if(ak.tile&&!ak.box&&!ak.tile.lock&&!ak.tile.queued){moveTile(a,c,r,c);changed=true}}
    if(changed){any=true;continue}
    outer:for(let r=G.R-1;r>=0;r--)for(let c=0;c<G.C;c++){const k=G.cells[r][c];if(!k.on||k.box||k.tile||canFillVert(r,c))continue;
      for(const dc of shuffleArr([-1,1])){const s=cellRC(r-1,c+dc);if(s&&s.on&&!s.box&&s.tile&&!s.tile.lock&&!s.tile.queued){moveTile(r-1,c+dc,r,c);changed=true;break outer}}}
    if(changed)any=true;
  }
  return any;
}
function collectGuitars(){
  let n=0;
  for(let c=0;c<G.C;c++){let r=G.R-1;while(r>=0&&!G.cells[r][c].on)r--;if(r<0)continue;const k=G.cells[r][c];
    if(k.tile&&k.tile.kind==='guitar'&&k.tile.y===r&&!k.tile.tw){const t=k.tile;k.tile=null;G.dying.push({t,t0:NOW(),dur:420,exit:true});goalInc('guitar',null,c,r);burst(c,r,'#ffd21f',14,5,'star');sfx('collect');n++}}
  return n;
}

/* ---------- удары */
function goalInc(type,color,x,y){const g=G.goals.find(g=>g.type===type&&(type!=='color'||g.c===color)&&g.got<g.need);if(!g)return;g.got++;flyTo(g,x,y)}
function removeTile(r,c,{toward=null}={}){
  const k=G.cells[r][c],t=k.tile;if(!t)return;k.tile=null;
  G.dying.push({t,t0:NOW(),dur:toward?170:230,toward});
  if(t.kind==='n'){goalInc('color',t.color,c,r);if(!toward)burst(c,r,PIECE[t.color].c,7,4)}
}
function hitDirt(r,c){const k=cellRC(r,c);if(!k||k.dirt<=0)return;k.dirt--;burst(c,r,'#94653a',5,3,'drop');if(k.dirt===0){goalInc('dirt',null,c,r);sfx('dirt')}}
function hitBox(r,c){const k=cellRC(r,c);if(!k||!k.box)return;const hp=k.box.hp;k.box.hp--;
  if(hp>=3){burst(c,r,'#cfccd6',10,5,'spark');sfx('metal')}else{burst(c,r,'#b07a43',hp===2?10:12,5,'shard');sfx('box')}
  if(k.box.hp<=0){k.box=null;goalInc('box',null,c,r);G.shake=Math.max(G.shake,2)}}
function breakLock(r,c){const t=G.cells[r][c].tile;if(!t||!t.lock)return;t.lock--;burst(c,r,'#cfccd6',8,4,'spark');sfx('metal');if(t.lock===0)goalInc('chain',null,c,r)}
function hitCell(r,c){
  const k=cellRC(r,c);if(!k||!k.on)return;
  if(k.box){hitBox(r,c);return}
  hitDirt(r,c);const t=k.tile;if(!t)return;
  if(t.lock){breakLock(r,c);return}
  if(t.kind==='guitar')return;
  if(isSpecial(t)){if(!t.queued)queueAct(r,c);return}
  removeTile(r,c);
}
function queueAct(r,c,extra){const t=G.cells[r][c].tile;if(!t||t.queued)return;t.queued=true;G.actQ.push({r,c,t,kind:t.kind,extra})}
const V=(r,c,kind,extra)=>G.actQ.push({r,c,kind,extra,virtual:true});

/* ---------- бонусы */
async function runSpecial(a){
  const {r,c,kind}=a;
  if(!a.virtual){const k=G.cells[r][c];if(k.tile===a.t){k.tile=null;G.dying.push({t:a.t,t0:NOW(),dur:200,flash:true})}}
  if(kind==='rh'||kind==='rv')return rocketFx(r,c,kind==='rh');
  if(kind==='bomb')return bombFx(r,c,a.extra&&a.extra.rad||2);
  if(kind==='bat')return batFx(r,c,a.extra&&a.extra.carry);
  if(kind==='vinyl')return vinylFx(r,c,a.extra||{});
}
async function rocketFx(r,c,h){
  sfx('rocket');FX.rockets.push({x:c,y:r,h,age:0});hitCell(r,c);
  const n=h?G.C:G.R;for(let d=1;d<n;d++){await sleep(24);if(h){hitCell(r,c-d);hitCell(r,c+d)}else{hitCell(r-d,c);hitCell(r+d,c)}}
}
async function bombFx(r,c,rad){
  sfx('bomb');buzz(rad>2?[40,30,60]:35);FX.rings.push({x:c,y:r,age:0,dur:.38,rad:rad+.6});G.shake=Math.max(G.shake,5+rad*2.2);G.flash=Math.max(G.flash,rad>2?.5:.25);
  burst(c,r,'#ffd21f',16,7,'spark');burst(c,r,'#ff7a1a',10,6,'sq');
  await sleep(70);hitCell(r,c);
  for(let dr=-rad;dr<=rad;dr++)for(let dc=-rad;dc<=rad;dc++){if(!dr&&!dc)continue;const m=Math.abs(dr)+Math.abs(dc);if(m>rad||(rad>2&&Math.max(Math.abs(dr),Math.abs(dc))>3))continue;hitCell(r+dr,c+dc)}
  await sleep(120);
}
function pickBatTarget(){
  const need=t=>G.goals.some(g=>g.type===t&&g.got<g.need);
  const needColor=new Set(G.goals.filter(g=>g.type==='color'&&g.got<g.need).map(g=>g.c));
  let best=[],bw=0;
  const add=(r,c,w)=>{if(G.batTargets.has(r*64+c))return;if(w>bw){bw=w;best=[{r,c}]}else if(w===bw)best.push({r,c})};
  for(let r=0;r<G.R;r++)for(let c=0;c<G.C;c++){const k=G.cells[r][c];if(!k.on)continue;
    if(k.box){add(r,c,need('box')?5+(k.box.hp===1?1:0):1);continue}
    const t=k.tile;if(!t||t.queued)continue;
    if(t.kind==='guitar'){const b=belowIdx(r,c);if(b>=0&&need('guitar')){const kb=G.cells[b][c];if(kb.tile&&kb.tile.kind!=='guitar'&&!kb.box)add(b,c,7)}continue}
    if(t.lock&&need('chain')){add(r,c,5);continue}
    if(k.dirt>0&&need('dirt')){add(r,c,4+k.dirt);continue}
    if(t.kind==='n'&&needColor.has(t.color)){add(r,c,2);continue}
    add(r,c,1);
  }
  if(!best.length)return null;const p=best[ri(best.length)];G.batTargets.add(p.r*64+p.c);return p;
}
async function batFx(r,c,carry){
  sfx('bat');hitCell(r,c);for(const [dr,dc] of DIRS)hitCell(r+dr,c+dc);
  const tg=pickBatTarget();if(!tg)return;
  await new Promise(res=>FX.bats.push({x0:c,y0:r,x1:tg.c,y1:tg.r,age:0,dur:.55,res,carry}));
  if(carry){burst(tg.c,tg.r,'#ffd21f',8,4,'spark');V(tg.r,tg.c,carry)}else{hitCell(tg.r,tg.c);burst(tg.c,tg.r,'#a259ff',8,4,'spark')}
}
function mostCommonColor(){const cnt=new Array(6).fill(0);for(const row of G.cells)for(const k of row)if(k.on&&!k.box&&k.tile&&k.tile.kind==='n'&&!k.tile.queued)cnt[k.tile.color]++;let b=0;for(let i=1;i<6;i++)if(cnt[i]>cnt[b])b=i;return b}
async function vinylFx(r,c,ex){
  if(ex.all)return vinylAll(r,c);
  const color=ex.color!=null&&ex.color>=0?ex.color:mostCommonColor();
  const targets=[];for(let q=0;q<G.R;q++)for(let w=0;w<G.C;w++){const k=G.cells[q][w];if(k.on&&!k.box&&k.tile&&k.tile.kind==='n'&&k.tile.color===color&&!(q===r&&w===c))targets.push({r:q,c:w})}
  sfx('vinyl');hitCell(r,c);FX.bolts.push({x:c,y:r,targets:targets.map(p=>({x:p.c,y:p.r})),age:0,dur:.55,col:PIECE[color].c});
  for(const p of targets){const t=tileAt(p);if(t)t.glow=NOW()}
  await sleep(430);
  if(ex.convert){const conv=[];for(const p of targets){const t=tileAt(p);if(t&&t.kind==='n'&&!t.lock){t.kind=ex.convert==='r'?(Math.random()<.5?'rh':'rv'):ex.convert;t.pop=NOW();conv.push(p)}else hitCell(p.r,p.c)}
    sfx('make');await sleep(420);for(const p of shuffleArr(conv))queueAct(p.r,p.c);return}
  for(const p of targets)hitCell(p.r,p.c);
  await sleep(100);
}
async function vinylAll(r,c){
  sfx('vinyl');sfx('bomb');G.flash=.9;G.shake=14;FX.rings.push({x:c,y:r,age:0,dur:.6,rad:Math.max(G.R,G.C)});
  const maxD=Math.max(G.R,G.C);for(let d=0;d<=maxD;d++){await sleep(45);for(let q=0;q<G.R;q++)for(let w=0;w<G.C;w++)if(Math.max(Math.abs(q-r),Math.abs(w-c))===d)hitCell(q,w)}
}
async function comboFx(t1,t2,pos,opos){

async function processActivations(){
  let guard=0;G.batTargets.clear();
  while(G.actQ.length&&guard++<300){const wave=G.actQ.splice(0);await Promise.all(wave.map(a=>runSpecial(a).catch(e=>console.error(e))));await sleep(50)}

/* ---------- ход */
const WORDS=['','','Хорошо!','Жара!','Панк-рок!','Хой!','Легенда!','Анархия!'];
async function clearGroups(groups,swapCells){
  let made=false;
  for(const g of groups){
    let make=g.type,at=null;
    if(make){const cand=g.cells.filter(p=>{const t=tileAt(p);return t&&!t.lock});
      if(swapCells)at=cand.find(p=>swapCells.some(s=>same(s,p)));
      if(!at&&g.pref)at=cand.find(p=>same(p,g.pref));
      if(!at)at=cand[Math.floor(cand.length/2)];if(!at)make=null}
    for(const p of g.cells){const t=tileAt(p);hitDirt(p.r,p.c);if(!t)continue;if(t.lock){breakLock(p.r,p.c);continue}removeTile(p.r,p.c,{toward:make?{x:at.c,y:at.r}:null})}
    const adj=new Set();for(const p of g.cells)for(const [dr,dc] of DIRS){const k=cellRC(p.r+dr,p.c+dc);if(k&&k.on&&k.box)adj.add((p.r+dr)*64+p.c+dc)}
    for(const key of adj)hitBox(Math.floor(key/64),key%64);
    if(make){const nt=mkTile(make,-1,at.r,at.c);nt.pop=NOW()+150;G.cells[at.r][at.c].tile=nt;made=true;buzz(15);const sk='sp_'+(make==='rv'?'rh':make);if(!SV.seen[sk]){SV.seen[sk]=1;save();G.spMsg=make}
      setTimeout(()=>{if(G){burst(at.c,at.r,'#ffd21f',10,5,'star');sfx('make')}},150);
      const nm={vinyl:'ПЛАСТИНКА!',bomb:'БОМБА!',rh:'РАКЕТА!',rv:'РАКЕТА!',bat:'МЫШЬ!'}[make];floatText(nm,at.c,at.r-.4,.48,'#ffd21f')}
  }
  sfx('match',G.combo-1+(made?2:0));
  if(G.combo>=2)floatText(WORDS[Math.min(G.combo,WORDS.length-1)],G.C/2-.5,G.R/2-.5,.8,'#ffd21f',true);
  await sleep(made?230:180);
}
async function resolveAll(swapCells){
  G.combo=0;
  for(let guard=0;guard<80;guard++){
    if(G.actQ.length)await processActivations();
    const groups=findGroups();
    if(groups.length){G.combo++;await clearGroups(groups,swapCells);swapCells=null;if(G.actQ.length)await processActivations()}
    const moved=gravity();
    if(moved)await waitSettle();
    const col=collectGuitars();
    if(col){await sleep(200);continue}
    if(!groups.length&&!moved&&!G.actQ.length)break;
  }
}
async function turn(fn){
  if(!G||G.busy||G.ended)return;G.busy=true;G.hint=null;
  try{await fn();await endTurn()}catch(e){if(e!=='skip')console.error(e);if(G)G.busy=false}
}

const SPMSG={rh:'Это бонус «Ракета» — он на золотом жетоне. Нажми или сдвинь его!',rv:'Это бонус «Ракета» — он на золотом жетоне. Нажми или сдвинь его!',bomb:'Это бонус «Бомба». Нажми — и всё вокруг разлетится!',bat:'Это бонус «Летучая мышь». Нажми — она сама найдёт цель.',vinyl:'Это бонус «Пластинка». Сдвинь на фишку — исчезнет весь её цвет.'};
const goalsDone=()=>G.goals.every(g=>g.got>=g.need);
async function doSwap(a,b,free){
  const ta=tileAt(a),tb=tileAt(b);if(!ta||!tb)return;
  sfx('swap');
  await Promise.all([tween(ta,{x:b.c,y:b.r},130),tween(tb,{x:a.c,y:a.r},130)]);
  setTile(b,ta);setTile(a,tb);
  if(free){await resolveAll([a,b]);return}
  if(isSpecial(ta)||isSpecial(tb)){
    G.moves--;updateHud();
    if(isSpecial(ta)&&isSpecial(tb))await comboFx(ta,tb,b,a);
    else{const [sp,pos,o]=isSpecial(ta)?[ta,b,tb]:[tb,a,ta];queueAct(pos.r,pos.c,sp.kind==='vinyl'?{color:o.kind==='n'?o.color:null}:null)}
    await processActivations();await resolveAll([a,b]);return;
  }
  if(!findGroups().length){
    sfx('bad');await Promise.all([tween(ta,{x:a.c,y:a.r},130),tween(tb,{x:b.c,y:b.r},130)]);setTile(a,ta);setTile(b,tb);
    throw 'nomatch';
  }
  G.moves--;updateHud();await resolveAll([a,b]);
}
function trySwap(a,b){
  const ka=cellRC(a.r,a.c),kb=cellRC(b.r,b.c);if(!movable(ka)||!movable(kb))return;
  G.sel=null;
  turn(async()=>{try{await doSwap(a,b,false)}catch(e){if(e==='nomatch'){if(G.tut)G.tut.waiting=false;G.busy=false;G.idleT=NOW();throw 'skip'}throw e}});
}
async function shuffleBoard(){
  banner('Перемешка!');await sleep(500);
  const P=[],T=[];for(let r=0;r<G.R;r++)for(let c=0;c<G.C;c++){const k=G.cells[r][c];if(movable(k)&&k.tile.kind==='n'){P.push({r,c});T.push(k.tile)}}
  let ok=false;
  for(let i=0;i<120&&!ok;i++){shuffleArr(T);P.forEach((p,j)=>G.cells[p.r][p.c].tile=T[j]);ok=!findGroups().length&&!!findMove()}
  if(!ok){for(let i=0;i<60&&!ok;i++){P.forEach(p=>G.cells[p.r][p.c].tile.color=-1);P.forEach(p=>G.cells[p.r][p.c].tile.color=pickNoMatch(p.r,p.c));ok=!!findMove()}}
  P.forEach(p=>{const t=G.cells[p.r][p.c].tile;t.r=p.r;t.c=p.c});
  await Promise.all(P.map(p=>{const t=G.cells[p.r][p.c].tile;return tween(t,{x:p.c,y:p.r},420,easeInOut)}));
  if(!ok){const k=G.cells.flat().find(k=>movable(k)&&k.tile.kind==='n');if(k){k.tile.kind='bomb';k.tile.pop=NOW()}}
}
async function finale(){

    const k=cand[ri(cand.length)];k.tile.kind=Math.random()<.5?'rh':'rv';k.tile.pop=NOW();G.moves--;bonus++;updateHud();burst(k.tile.c,k.tile.r,'#ffd21f',6,4,'star');sfx('coin');await sleep(110)}

function useBoost(p){
  const k=G.boost,cell=cellRC(p.r,p.c);if(!cell||!cell.on)return;
  if(k==='hammer'){if(!cell.box&&!cell.tile)return;SV.inv.hammer--;save();G.boost=null;updateBoostUI();
    turn(async()=>{FX.hammers.push({x:p.c,y:p.r,age:0});await sleep(260);sfx('bomb');G.shake=7;FX.rings.push({x:p.c,y:p.r,age:0,dur:.3,rad:1});
      const t=cell.tile;if(t&&t.kind==='guitar'){cell.tile=null;G.dying.push({t,t0:NOW(),dur:300});G.guitarsLeft++}else hitCell(p.r,p.c);
      await processActivations();await resolveAll()})}
  else if(k==='cymbal'){SV.inv.cymbal--;save();G.boost=null;updateBoostUI();
    turn(async()=>{sfx('crash');G.shake=6;FX.waves.push({y:p.r,age:0});for(let c=0;c<G.C;c++){hitCell(p.r,c);await sleep(30)}await processActivations();await resolveAll()})}
  else if(k==='glove'){
    if(!movable(cell))return;
    if(!G.gloveSel){G.gloveSel=p;sfx('click');return}
    const a=G.gloveSel;if(same(a,p)){G.gloveSel=null;return}
    if(Math.abs(a.r-p.r)+Math.abs(a.c-p.c)!==1){G.gloveSel=p;return}
    SV.inv.glove--;save();G.boost=null;G.gloveSel=null;updateBoostUI();
    turn(()=>doSwap(a,p,true));
  }
}

const TW=[];
function tween(o,to,dur,ease=easeOut){return new Promise(res=>{const from={};for(const k in to)from[k]=o[k];o.tw=(o.tw||0)+1;TW.push({o,from,to,t0:NOW(),dur,ease,res})})}
function settled(){if(TW.length)return false;for(const row of G.cells)for(const k of row){const t=k.tile;if(t&&(t.y!==t.r||t.x!==t.c))return false}return true}
function waitSettle(){return new Promise(res=>G.waiters.push(res))}

function burst(x,y,col,n=8,sp=4,kind='sq'){if(FX.parts.length>450)return;for(let i=0;i<n;i++)FX.parts.push({x,y,vx:rnd(-1,1)*sp,vy:rnd(-1.5,.5)*sp,g:14,life:rnd(.35,.75),age:0,col,size:rnd(.06,.13),kind,rot:rnd(0,6),vr:rnd(-9,9)})}
function floatText(txt,x,y,size,col,big){FX.texts.push({txt,x,y,size,col,age:0,dur:big?1.1:.9,big})}
let FLY=0;
function flyTo(g,x,y){
  const el=g.el;if(!el){g.shown++;return}
  if(FLY>=14){setTimeout(()=>bumpGoal(g),250);return}
  const app=$('#app').getBoundingClientRect(),cr=cv.getBoundingClientRect(),er=el.querySelector('img').getBoundingClientRect();
  const sx=cr.left-app.left+G.ox+(x+.5)*G.cs-19,sy=cr.top-app.top+G.oy+(y+.5)*G.cs-19,ex=er.left-app.left+er.width/2-19,ey=er.top-app.top+er.height/2-19;
  const im=document.createElement('img');im.src=g.icon;im.className='flyer';im.alt='';im.style.left=sx+'px';im.style.top=sy+'px';$('#app').appendChild(im);FLY++;
  im.getBoundingClientRect();requestAnimationFrame(()=>{im.style.transform=`translate(${ex-sx}px,${ey-sy}px) scale(.85)`});
  setTimeout(()=>{im.remove();FLY--;bumpGoal(g)},470);
}
function bumpGoal(g){g.shown=Math.min(g.need,g.shown+1);const el=g.el;if(!el)return;el.querySelector('span').textContent=Math.max(0,g.need-g.shown);el.classList.toggle('done',g.shown>=g.need);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}

  cv.width=Math.max(1,Math.round(BW*DPR));cv.height=Math.max(1,Math.round(BH*DPR));

function updateGame(dt,now){
  for(let i=TW.length-1;i>=0;i--){const w=TW[i];const k=clamp((now-w.t0)/w.dur,0,1),e=w.ease(k);for(const p in w.to)w.o[p]=lerp(w.from[p],w.to[p],e);if(k>=1){TW.splice(i,1);w.o.tw--;w.res()}}
  for(const row of G.cells)for(const k of row){const t=k.tile;if(!t||t.tw)continue;
    if(t.y<t.r){t.vy=Math.min(t.vy+70*dt,24);t.y=Math.min(t.r,t.y+t.vy*dt);if(t.y>=t.r){t.y=t.r;t.vy=0;t.land=1}}else if(t.y>t.r){t.y=Math.max(t.r,t.y-10*dt)}else t.vy=0;
    if(t.x!==t.c){const d=t.c-t.x,s=Math.sign(d)*Math.min(Math.abs(d),7*dt);t.x+=s}
    if(t.land>0)t.land=Math.max(0,t.land-dt*5)}
  if(G.waiters.length&&settled()){const w=G.waiters.splice(0);w.forEach(f=>f())}
  G.dying=G.dying.filter(d=>now-d.t0<d.dur);
  for(const p of FX.parts){p.age+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}FX.parts=FX.parts.filter(p=>p.age<p.life);
  for(const k of ['texts','rockets','rings','bolts','hammers','waves'])for(const f of FX[k])f.age+=dt;
  FX.texts=FX.texts.filter(t=>t.age<t.dur);FX.rings=FX.rings.filter(t=>t.age<t.dur);FX.bolts=FX.bolts.filter(t=>t.age<t.dur);FX.hammers=FX.hammers.filter(t=>t.age<.5);FX.waves=FX.waves.filter(t=>t.age<.5);
  const big=Math.max(G.R,G.C)+3;FX.rockets=FX.rockets.filter(f=>f.age*40<big);
  for(const r of FX.rockets){if(Math.random()<.7){const d=r.age*40;for(const s of [1,-1]){const x=r.h?r.x+d*s:r.x,y=r.h?r.y:r.y+d*s;FX.parts.push({x,y,vx:rnd(-.5,.5),vy:rnd(-.5,.5),g:0,life:.3,age:0,col:Math.random()<.5?'#ffd21f':'#ff7a1a',size:rnd(.08,.16),kind:'drop',rot:0,vr:0})}}}
  for(let i=FX.bats.length-1;i>=0;i--){const b=FX.bats[i];b.age+=dt;if(b.age>=b.dur){FX.bats.splice(i,1);b.res()}}
  G.shake*=Math.pow(.02,dt);if(G.shake<.2)G.shake=0;G.flash=Math.max(0,G.flash-dt*2.2);
  if(!G.busy&&!G.ended&&!G.hint&&!G.boost&&!G.tut&&now-G.idleT>5500){G.hint=findMove();if(G.hint)G.hint.t0=now;else G.idleT=now}
}
function drawTileAt(x,t,px,py,s,now){
  const cs=G.cs;if(s<=0)return;
  let sx=s,sy=s;if(t.land){sx*=1+.1*t.land;sy*=1-.12*t.land}
  if(t.kind==='n'||t.kind==='guitar'){const img=spr(t.kind==='n'?'n'+t.color:'gtr',xx=>drawPiece(xx,t.kind,t.color,0));const w=cs*.94;x.drawImage(img,px-w*sx/2,py-w*sy/2+(1-sy)*w*.35,w*sx,w*sy)}
  else{const k=isSpecial(t)?.8:.94;x.save();x.translate(px,py);x.scale(cs*k*sx,cs*k*sy);drawPiece(x,t.kind,t.color,now/1000);x.restore()}
  if(t.lock){const img=spr('ch'+t.lock,xx=>drawChain(xx,t.lock));x.drawImage(img,px-cs/2,py-cs/2,cs,cs)}
}
const AURA={rh:['#fff09a','#e0a000'],rv:['#fff09a','#e0a000'],bomb:['#ffb27a','#d2400f'],bat:['#e2c9ff','#7a3fd0'],vinyl:['#ff9ae0','#3d6bff']};
function drawAura(x,kind,px,py,w,ts){const [c1,c2]=AURA[kind];x.save();x.translate(px,py);x.rotate(ts*1.3);x.fillStyle='rgba(255,236,140,.38)';
  for(let i=0;i<10;i++){x.rotate(Math.PI/5);x.beginPath();x.moveTo(-w*.06,-w*.2);x.lineTo(0,-w*.66);x.lineTo(w*.06,-w*.2);x.closePath();x.fill()}x.restore();
  const pulse=1+Math.sin(ts*5)*.03;x.save();x.translate(px,py);x.scale(pulse,pulse);
  const g=x.createRadialGradient(-w*.12,-w*.16,w*.04,0,0,w*.47);g.addColorStop(0,c1);g.addColorStop(1,c2);
  x.beginPath();x.arc(0,0,w*.46,0,Math.PI*2);x.fillStyle=g;x.fill();x.lineWidth=Math.max(2,w*.055);x.strokeStyle='#0b090b';x.stroke();
  x.setLineDash([w*.07,w*.05]);x.lineWidth=Math.max(1.5,w*.03);x.strokeStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(0,0,w*.38,0,Math.PI*2);x.stroke();x.setLineDash([]);x.restore()}
function renderGame(now){
  const x=cx;x.setTransform(DPR,0,0,DPR,0,0);x.clearRect(0,0,BW,BH);if(!G||!G.clip)return;
  const {cs,ox,oy,R,C}=G,ts=now/1000;

  x.fillStyle='#ece6d6';for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(G.cells[r][c].on)x.fillRect(ox+c*cs-5,oy+r*cs-5,cs+10,cs+10);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(G.cells[r][c].on){x.fillStyle=(r+c)%2?'#2a222a':'#211b21';x.fillRect(ox+c*cs,oy+r*cs,cs,cs)}
  x.save();x.fillStyle='rgba(255,210,31,.85)';x.translate(ox+8,oy-4);x.rotate(-.6);x.fillRect(-28,-9,56,18);x.restore();
  x.save();x.fillStyle='rgba(255,210,31,.85)';x.translate(ox+C*cs-8,oy-4);x.rotate(.6);x.fillRect(-28,-9,56,18);x.restore();
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const k=G.cells[r][c];if(k.on&&k.dirt>0){const img=spr(`d${k.dirt}_${r}_${c}`,xx=>drawDirt(xx,k.dirt,r*31+c*7+3));x.drawImage(img,ox+c*cs,oy+r*cs,cs,cs)}}
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const k=G.cells[r][c];if(k.on&&k.box){const img=spr('b'+k.box.hp,xx=>drawBox(xx,k.box.hp));x.drawImage(img,ox+c*cs,oy+r*cs,cs,cs)}}
  x.save();x.clip(G.clip);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const t=G.cells[r][c].tile;if(isSpecial(t)){let s=1;if(t.pop){const k=(now-t.pop)/320;s=k<0?0:k<1?easeBack(k):1}if(s>0)drawAura(x,t.kind,PX(t.x),PY(t.y),cs*s,ts)}}
  const hint=G.hint,hw=hint?Math.sin((now-hint.t0)/1000*14)*.08:0;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const t=G.cells[r][c].tile;if(!t)continue;
    let px=PX(t.x),py=PY(t.y),s=1;
    if(t.pop){const k=(now-t.pop)/320;s=k<0?0:k<1?easeBack(k):1}
    if(hint&&!hint.sp){if(r===hint.a.r&&c===hint.a.c){px+=(hint.b.c-hint.a.c)*hw*cs;py+=(hint.b.r-hint.a.r)*hw*cs}if(r===hint.b.r&&c===hint.b.c){px-=(hint.b.c-hint.a.c)*hw*cs;py-=(hint.b.r-hint.a.r)*hw*cs}}
    if(hint&&hint.sp&&r===hint.a.r&&c===hint.a.c)s*=1+Math.abs(hw)*1.2;
    const sel=(G.sel&&G.sel.r===r&&G.sel.c===c)||(G.gloveSel&&G.gloveSel.r===r&&G.gloveSel.c===c);
    if(sel){x.fillStyle='rgba(255,210,31,.28)';x.fillRect(ox+c*cs+2,oy+r*cs+2,cs-4,cs-4);s*=1.08}
    if(t.glow&&now-t.glow<500){x.fillStyle=`rgba(255,255,255,${.5*(1-(now-t.glow)/500)})`;x.beginPath();x.arc(px,py,cs*.48,0,7);x.fill()}
    drawTileAt(x,t,px,py,s,now)}
  for(const d of G.dying){const k=clamp((now-d.t0)/d.dur,0,1),t=d.t;let px=PX(t.x),py=PY(t.y),s=1;
    if(d.toward){px=lerp(px,PX(d.toward.x),easeOut(k));py=lerp(py,PY(d.toward.y),easeOut(k));s=1-k*.5}
    else if(d.exit){py+=k*cs*.8;s=1-k*.3}else s=1+k*.25;
    x.globalAlpha=d.toward?1-k*.3:1-k;
    if(d.flash){x.fillStyle=`rgba(255,240,200,${1-k})`;x.beginPath();x.arc(px,py,cs*(.4+k*.5),0,7);x.fill()}
    drawTileAt(x,Object.assign({},t,{lock:0,land:0}),px,py,s,now);x.globalAlpha=1}
  x.restore();
  if(G.boost==='cymbal'||G.boost==='hammer'){x.strokeStyle='rgba(255,210,31,.6)';x.setLineDash([6,6]);x.lineWidth=2;x.strokeRect(ox-2,oy-2,C*cs+4,R*cs+4);x.setLineDash([])}

    x.strokeStyle='#ffd21f';x.lineWidth=3;x.setLineDash([8,6]);x.lineDashOffset=-now/40;for(const p of s.cells)x.strokeRect(ox+p.c*cs+1.5,oy+p.r*cs+1.5,cs-3,cs-3);x.setLineDash([]);

      x.save();x.globalAlpha=k>.85?1-(k-.85)/.15:1;x.translate(hx,hy);const sc=cs*1.05*(k<.15?1.1-k/.15*.1:1);x.scale(sc,sc);drawHand(x);x.restore()}
    else if(s.type==='tap'){const b=Math.max(0,Math.sin(now/1000*6));x.save();x.translate(PX(s.p.c),PY(s.p.r)+b*cs*.12);const sc=cs*1.05*(1-b*.08);x.scale(sc,sc);drawHand(x);x.restore()}
  }

  x.globalAlpha=1;

      x.strokeStyle=b.col;x.lineWidth=5;x.stroke();x.strokeStyle='#fff';x.lineWidth=2;x.stroke()}

    const X=(1-k)*(1-k)*b.x0+2*(1-k)*k*cxp+k*k*b.x1,Y=(1-k)*(1-k)*b.y0+2*(1-k)*k*cyp+k*k*b.y1;

  for(const h of FX.hammers){const k=clamp(h.age/.28,0,1);x.save();x.translate(PX(h.x)+cs*.3,PY(h.y)-cs*.3);x.rotate(-1.4+k*1.3);x.translate(0,-cs*.5);x.scale(cs*1.3,cs*1.3);x.globalAlpha=h.age>.35?1-(h.age-.35)/.15:1;drawHammer(x);x.restore();x.globalAlpha=1}

    x.save();x.globalAlpha=k>.7?1-(k-.7)/.3:1;x.font=`${fs}px ${F_MONO}`;const w=x.measureText(t.txt).width,maxW=BW-32;if(w>maxW){fs=fs*maxW/w;x.font=`${fs}px ${F_MONO}`}

  modal(`<h2>Ремонт гаража</h2><p class="sub">готово ${idx} из ${TASKS.length}</p><div class="prog"><i style="width:${idx/TASKS.length*100}%"></i></div>
    <div class="tasks">${list.map((tk,i)=>`<div class="task ${i?'locked':''}"><img src="${icon('t_'+tk.id)}" alt=""><div class="tt">${tk.t}<small>${i?'после предыдущей':tk.d}</small></div>${i?'':`<button class="btn ${SV.stars>=tk.cost?'red':'ghost'}" data-a="do">${SVG_STAR}${tk.cost}</button>`}</div>`).join('')}</div>
    <p class="sub" style="margin-top:14px">звёзд: ${SV.stars} · звезду дают за каждый уровень</p>
    <div class="row"><button class="btn ghost" data-a="x">Закрыть</button><button class="btn yellow" data-a="play">Играть</button></div>`,
    a=>{if(a==='x'){closeModal();return}if(a==='play'){closeModal();openPreLevel();return}
      if(a==='do'){const tk=TASKS[idx];if(SV.stars<tk.cost){toast(`Нужно ещё ${tk.cost-SV.stars} — пройди уровень`);return}closeModal();if(tk.vars)openVariants(tk);else doTask(tk,0)}});
}
function openVariants(tk){
  let v=0;ROOM.preview={id:tk.id,v};ROOM.pop={id:tk.id,t0:NOW()/1000};$('#say').hidden=true;
  const render=()=>modal(`<h2>${tk.t}</h2><p class="sub">гараж уже примеряет</p>
    <div class="pre">${tk.vars.map((n,i)=>`<button class="opt ${i===v?'on':''}" data-a="v${i}"><i class="sw" style="background:${tk.sw[i]}"></i>${n}</button>`).join('')}</div>
    <div class="row"><button class="btn red" data-a="ok">Готово · ${tk.cost}★</button><button class="btn ghost" data-a="x">Отмена</button></div>`,
    a=>{if(a==='x'){ROOM.preview=null;closeModal();return}if(a==='ok'){ROOM.preview=null;closeModal();doTask(tk,v);return}if(a[0]==='v'){v=+a.slice(1);ROOM.preview={id:tk.id,v};ROOM.pop={id:tk.id,t0:NOW()/1000};sfx('slap');render()}},true);
  render();
}
function doTask(tk,v){
  SV.stars-=tk.cost;SV.tasks.push(tk.id);SV.variants[tk.id]=v;save();ROOM.pop={id:tk.id,t0:NOW()/1000};
  sfx('slap');setTimeout(()=>{sfx('collect');G3?G3.burst(tk.id):roomBurst(tk.id);buzz(25)},350);setTimeout(()=>sfx('win'),600);updateTop();
  SAYQ=[];$('#say').hidden=true;say(tk.say);
  if(SV.tasks.length===TASKS.length)setTimeout(()=>say('Это была только первая глава. Гоша ещё вернётся — с новой сценой.'),400);
  else{const n=TASKS[SV.tasks.length];if(SV.stars>=n.cost)say(`Звёзд хватает ещё на одно дело: «${n.t}». Жми на метку в гараже.`)}
}
function goHome(won){
  show('home');updateTop();
  if(won){const n=TASKS[SV.tasks.length];if(n&&SV.stars>=n.cost)setTimeout(()=>say(`Есть звезда! Жми на красную метку — делаем «${n.t.toLowerCase()}».`),350)}
}
$('#tasksBtn').addEventListener('click',()=>{sfx('click');openTasks()});
$('#playBtn').addEventListener('click',()=>{sfx('click');openPreLevel()});
$('#setBtn').addEventListener('click',()=>{audioInit();openSettings()});
function openSettings(){
  let armed=false;
  const m=modal(`<h2>Настройки</h2>
    <div class="set"><span>Музыка<small>${AU.custom?'играет твой трек':'панк-генератор в ля-миноре'}</small></span><button class="sw2" data-a="mus" aria-pressed="${SV.music}" aria-label="Музыка"></button></div>
    <div class="set"><span>Звуки</span><button class="sw2" data-a="sfx" aria-pressed="${SV.sfx}" aria-label="Звуки"></button></div>
    <div class="set"><span>Свой трек<small>mp3 с телефона — будет играть по кругу</small></span><label class="btn ghost small filebtn">Выбрать<input type="file" id="trackIn" accept="audio/*"></label></div>
    ${AU.custom?'<div class="set"><span>Вернуть генератор</span><button class="btn ghost small" data-a="gen">Вернуть</button></div>':''}
    <div class="set"><span>На весь экран<small>для телефона: без панелей браузера</small></span><button class="btn ghost small" data-a="fs">${document.fullscreenElement?'Выйти':'Включить'}</button></div>
    <div class="set"><span>Справочник<small>бонусы, комбо, препятствия</small></span><button class="btn ghost small" data-a="enc">Открыть</button></div>
    <div class="set"><span>Сбросить прогресс<small>начать гараж и обучение заново</small></span><button class="btn ghost small" data-a="reset">Сбросить</button></div>
    <div class="row"><button class="btn red" data-a="x">Готово</button></div>`,
    (a,b)=>{if(a==='mus'){setMusic(!SV.music);b.setAttribute('aria-pressed',SV.music);return}if(a==='sfx'){SV.sfx=!SV.sfx;save();b.setAttribute('aria-pressed',SV.sfx);return}
      if(a==='gen'){backToGenerator();closeModal();return}
      if(a==='enc'){openEncyclopedia(openSettings);return}
      if(a==='fs'){toggleFS();closeModal();return}
      if(a==='reset'){if(!armed){armed=true;b.textContent='Точно?';b.classList.add('red');return}const mus=SV.music,s=SV.sfx;SV=clone(DEF);SV.intro=true;SV.music=mus;SV.sfx=s;save();closeModal();updateTop();toast('Гараж снова в хламе');return}
      closeModal()});
  m.querySelector('#trackIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f){useCustomTrack(f);closeModal()}});
}

/* ================= ЦИКЛ И СТАРТ ================= */
function toggleFS(){const d=document,e=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else{const f=e.requestFullscreen||e.webkitRequestFullscreen;const r=f&&f.call(e,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>toast('Браузер не разрешил полный экран'));if(!f)toast('Этот браузер не умеет в полный экран — добавь игру на главный экран')}}catch(e){toast('Браузер не разрешил полный экран')}}
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('fullscreenchange',()=>setTimeout(()=>{resizeRoom();resizeBoard()},120));
let last=NOW();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  try{if(VIEW==='game'&&G){updateGame(dt,now);renderGame(now)}else if(VIEW==='home'){G3?G3.render(now):renderRoom(now)}}catch(e){console.error(e)}
  requestAnimationFrame(frame)}
window.addEventListener('resize',()=>{resizeRoom();resizeBoard()});
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else AU.ctx.resume()});
(function grain(){const s=180,g=mk(s,s),x=g.getContext('2d'),im=x.createImageData(s,s);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);
  const d=document.createElement('div');d.id='grain';d.style.backgroundImage=`url(${g.toDataURL()})`;document.body.appendChild(d)})();
function paintStatic(){
  drawGoshaAvatar($('#ava'));drawGoshaAvatar($('#ava2'));
  const c=$('#titleArt'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);const items=[['n',0],['bomb'],['n',3],['vinyl'],['n',1],['bat'],['n',4],['rh']];
  items.forEach((it,i)=>{x.save();x.translate(55+i*93,100+(i%2?-22:22));x.rotate((i%3-1)*.25);x.scale(92,92);drawPiece(x,it[0],it[1]||0,i);x.restore()});
  ransom($('#logoSmall'),'Дом Рокера');ransom($('#logoBig'),'Дом Рокера');
}
function boot(){
  paintStatic();updateTop();show('home');resizeRoom();requestAnimationFrame(frame);
  if(!SV.intro)$('#title').hidden=false;
  else setTimeout(()=>say(SV.tasks.length?GOSHA_IDLE[ri(GOSHA_IDLE.length)]:'С возвращением! Жми «Уровень» — заработаем звёзды на ремонт.'),400);
}
$('#startBtn').addEventListener('click',()=>{audioInit();sfx('win');SV.intro=true;save();$('#title').hidden=true;resizeRoom();
  say('Йо! Я Гоша. В девяносто восьмом в этом гараже репетировали «Ржавые гвозди». Моя группа.','Двадцать лет тут копился хлам. Но дом рокера не может стоять без музыки.',
      'Проходи уровни — за каждый дают звезду. На звёзды делаем ремонт: красная метка в гараже показывает, что дальше.','В конце устроим квартирник! Жми «Уровень». Погнали!')});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const k in ICONS)delete ICONS[k];ROOM.items={};ROOM.bg=null;if(G3)G3.refresh();updateTop();paintStatic()});
boot();
</script>

</body>
